<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SBC Survivor Edition</title>
<style>
:root {
  --bg:#020406; --panel:#071019; --line:#273947; --gold:#ffc928; --green:#59e14e;
  --blue:#2ab5ff; --purple:#c96cff; --red:#ff564b; --white:#f7f9fb; --muted:#9aaab8;
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at 52% -15%,rgba(47,105,190,.17),transparent 31%),linear-gradient(#020406,#05090d 60%,#020406);color:var(--white);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:32px 32px}
button{font:inherit} a{color:inherit;text-decoration:none}
.shell{max-width:1100px;margin:auto;padding:0 18px 80px}
.top{height:72px;display:flex;align-items:center;border-bottom:1px solid #172431;position:sticky;top:0;z-index:50;background:rgba(2,4,6,.94);backdrop-filter:blur(13px)}
.brand{display:flex;align-items:center;gap:11px}
.shield{width:44px;height:44px;border:2px solid var(--gold);border-radius:12px;overflow:hidden;display:grid;place-items:center}
.shield img{width:100%;height:100%;image-rendering:pixelated;object-fit:cover}
.brand strong{display:block;font-size:18px} .brand span{display:block;font-size:9px;letter-spacing:.25em;color:var(--gold);font-weight:900}

.panel{background:linear-gradient(180deg,rgba(9,18,27,.98),rgba(3,8,13,.99));border:1px solid var(--line);border-radius:17px;box-shadow:0 18px 42px #0007}

.pitch{min-height:300px;padding:32px;display:grid;grid-template-columns:155px 1fr;gap:22px;align-items:center;position:relative;overflow:hidden;margin-top:24px}
.pitch:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 70%,rgba(47,132,255,.18),transparent 25%),radial-gradient(circle at 70% 20%,rgba(80,235,74,.06),transparent 32%)}
.pitch img{width:145px;image-rendering:pixelated;position:relative;z-index:2;filter:drop-shadow(0 16px 25px #000);border-radius:14px}
.pitch-copy{position:relative;z-index:2;max-width:640px}
.pitch-copy h1{font-size:52px;line-height:.95;letter-spacing:-.04em;margin:0;font-weight:1000}
.pitch-copy h1 span{color:var(--green)}
.pitch-copy p{font-size:16px;line-height:1.4;color:var(--gold);font-weight:800;margin:16px 0 0}
.pitch-sub{color:var(--muted);font-size:14px;font-weight:500;margin-top:10px;line-height:1.5}

.live-strip{display:grid;grid-template-columns:repeat(4,1fr);margin-top:20px;overflow:hidden}
.live-strip div{padding:16px;text-align:center;background:#071019;border-right:1px solid #263746}
.live-strip div:last-child{border-right:0}
.live-strip b{display:block;color:var(--gold);font-size:20px} .live-strip span{font-size:11px;color:#d7e0e6}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.action{border:0;border-radius:13px;padding:20px 22px;color:white;font-size:20px;font-weight:1000;display:flex;justify-content:space-between;align-items:center;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 12px 28px #0007}
.action small{display:block;font-size:11px;font-weight:650;margin-top:4px;color:#eef3f6}
.green{background:linear-gradient(#3dc72f,#12651a)} .blue{background:linear-gradient(#2792dc,#074a7b)}

.how{margin-top:22px;padding:20px}
.how h2{margin:0}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:16px}
.step{padding:16px;border:1px solid #273947;border-radius:12px;min-height:190px}
.step .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#152331;border:1px solid #456070;font-weight:1000}
.step h3{margin:11px 0 5px;font-size:17px}
.step p{font-size:12px;color:#cbd5dc;line-height:1.45}
.step
