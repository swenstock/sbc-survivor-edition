<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Seasons — Stonk Broker Challenge Survivor</title>
<link rel="stylesheet" href="/css/base.css">
<style>
.season-grid{display:grid;gap:14px;margin-top:20px}
.season-card{padding:20px;display:flex;justify-content:space-between;align-items:center;gap:16px;cursor:pointer;transition:.15s}
.season-card:hover{transform:translateY(-2px);border-color:var(--gold)}
.season-card .left{display:flex;flex-direction:column;gap:6px}
.season-card .cadence{font-size:20px;font-weight:1000;text-transform:capitalize}
.season-card .meta{font-size:12px;color:var(--muted)}
.season-card .right{display:flex;gap:22px;text-align:right}
.season-card .stat b{display:block;color:var(--gold);font-size:18px}
.season-card .stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.empty{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="top">
  <div class="shell" style="padding:0 18px;display:flex;align-items:center;">
    <a href="/" class="brand"><div class="shield"><img class="js-avatar" alt="Stonk Broker Challenge"></div><div><strong>STONK BROKER CHALLENGE</strong><span>SURVIVOR EDITION</span></div></a>
  </div>
</div>

<div class="shell">
  <a href="/" class="back-link">← Home</a>
  <h1 style="font-size:32px;margin:8px 0 0;font-weight:1000;">Open Seasons</h1>
  <p style="color:var(--muted);font-size:14px;margin-top:4px;">Pick a season to join, pick a stonk, or check who's still alive.</p>

  <div id="grid" class="season-grid"></div>
</div>

<script>
const AVATAR_SRC = '/img/survivor-avatar.svg';
document.querySelectorAll('.js-avatar').forEach(img => img.src = AVATAR_SRC);

fetch('/api/knockout/seasons')
  .then(r => r.json())
  .then(data => {
    const seasons = data.seasons || [];
    const grid = document.getElementById('grid');
    if (seasons.length === 0) {
      grid.innerHTML = '<div class="panel empty">No seasons yet — check back soon.</div>';
      return;
    }
    grid.innerHTML = seasons.map(s => `
      <div class="panel season-card" onclick="location.href='/season.html?id=${s.id}'">
        <div class="left">
          <div class="cadence">${s.cadence}</div>
          <div class="meta">
            <span class="badge badge-${s.status}">${s.status.replace('_',' ')}</span>
            &nbsp;•&nbsp; ${s.entry_fee_stonk.toLocaleString()} STONK entry
            ${s.status !== 'enrolling' ? `&nbsp;•&nbsp; Round ${s.current_round || 1}` : ''}
          </div>
        </div>
        <div class="right">
          <div class="stat"><b>${s.entry_count}</b><span>Entries</span></div>
          <div class="stat"><b>${s.alive_count}</b><span>Alive</span></div>
          <div class="stat"><b>${s.pot_stonk.toLocaleString()}</b><span>Pot</span></div>
        </div>
      </div>
    `).join('');
  })
  .catch(() => {
    document.getElementById('grid').innerHTML = '<div class="panel empty">Couldn\'t load seasons right now.</div>';
  });
</script>
</body>
</html>
